apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-app-deployment
  labels:
    app: streamlit-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-app
  template:
    metadata:
      labels:
        app: streamlit-app
    spec:
      containers:
      - name: streamlit-app
        image: maeldieudonne/mlops:test
        ports:
        - containerPort: 8000
        command: ["/bin/bash", "-c"]
        args:
        - |
          poetry run python setup/db_init.py && \
          poetry run python scheduler.py & \
          streamlit run /Streamlit/streamlit.py \
            --server.port 8000 \
            --server.enableCORS false \
            --server.enableXsrfProtection false
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
